name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      prerelease: ${{ steps.vars.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive tag and version
        id: vars
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # Parse semver and mark GitHub release prereleases (e.g., -rc.1).
          SEMVER_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ ! "$VERSION" =~ $SEMVER_REGEX ]]; then
            echo "Tag '$TAG' is not valid semver (expected vMAJOR.MINOR.PATCH with optional prerelease/build)." >&2
            exit 1
          fi

          PRERELEASE="false"
          if [[ -n "${BASH_REMATCH[4]}" ]]; then
            PRERELEASE="true"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          set -euo pipefail
          mkdir -p dist

          VERSION='${{ steps.vars.outputs.version }}'
          ESCAPED_VERSION="${VERSION//./\\.}"

          # Extract only this release section from CHANGELOG.md and skip the
          # version heading line because the GitHub release name already has it.
          awk -v heading_regex="^##[[:space:]]+\\[?${ESCAPED_VERSION}\\]?([[:space:]]*\\(|[[:space:]]|$)" '
            BEGIN {
              capture = 0
            }
            $0 ~ heading_regex {
              capture = 1
              next
            }
            capture && /^##[[:space:]]+/ {
              exit
            }
            capture {
              print
            }
          ' CHANGELOG.md > dist/release-notes.md

          # Trim leading blank lines after removing the version heading.
          sed -i '/./,$!d' dist/release-notes.md

          if ! grep -q '[^[:space:]]' dist/release-notes.md; then
            echo "No CHANGELOG notes found for version ${VERSION}." > dist/release-notes.md
          fi

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: dist/release-notes.md

  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.tag }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.setup.outputs.tag }}
        run: |
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          artifact="vault-secrets-cleanup-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${artifact}" ./cmd/vault-secrets-cleanup

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs:
      - setup
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: dist

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: build-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          name: ${{ needs.setup.outputs.tag }}
          prerelease: ${{ needs.setup.outputs.prerelease }}
          body_path: dist/release-notes.md
          files: |
            dist/vault-secrets-cleanup-*
            dist/checksums.txt
