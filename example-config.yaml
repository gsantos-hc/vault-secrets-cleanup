vault:
  address: https://vault.example.com
  token: replace-with-token-or-use-env

rate_limit:
  requests_per_second: 100
  burst: 100

staleness:
  default_days: 365
  namespaces:
    prod/*: 730
    dev/*: 90

exclusions:
  namespaces:
    - admin/*
    - system/*
  paths:
    - "*/bootstrap/*"
    - "*/root-token"
  mounts:
    - internal/*

logging:
  level: info
  format: text
